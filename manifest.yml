modules:
  jira:projectPage:
    - key: gonogo-project-page
      resource: release-board
      resolver:
        function: ui-resolver
      render: native
      title: GoNoGo Release Confidence
  jira:issuePanel:
    - key: gonogo-issue-panel
      resource: issue-panel
      resolver:
        function: ui-resolver
      render: native
      title: Ship risk
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  rovo:agent:
    - key: gonogo-release-captain
      name: GoNoGo Release Captain
      description: >
        Tells you whether a Jira release is ready to ship, explains every risk with
        evidence from your issues, and posts a go/no-go report your team can act on.
      prompt: resource:agent-prompts;agent-prompt.txt
      conversationStarters:
        - Is our next release ready to ship?
        - What is blocking this release?
        - How risky is this issue for the release?
        - Post a go/no-go report on this issue
      actions:
        - get-release-readiness
        - list-release-blockers
        - get-issue-ship-risk
        - post-go-no-go-report
      skills:
        - release-go-no-go

  rovo:skill:
    - key: release-go-no-go
      source:
        dir: skills/release-go-no-go
      dependencies:
        tools:
          - get-release-readiness
          - list-release-blockers
          - get-issue-ship-risk

  rovo:mcp:
    - key: gonogo-mcp
      name: GoNoGo Release MCP
      tools:
        - get-release-readiness
        - list-release-blockers
        - get-issue-ship-risk

  action:
    - key: get-release-readiness
      name: Get release readiness
      function: action-readiness
      actionVerb: GET
      description: >
        Scores how ready a Jira release (fix version) is to ship, from 0 to 100, with a
        GO / CAUTION / NO-GO verdict, the checks that failed, and the issues behind each
        finding. Use when someone asks if a release, version or sprint is ready to ship.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: The Jira project key, for example SHOP. Defaults to the current project.
        versionName:
          title: Version name
          type: string
          required: false
          description: The fix version name, for example 2.4.0. Defaults to the next unreleased version.
    - key: list-release-blockers
      name: List release blockers
      function: action-blockers
      actionVerb: GET
      description: >
        Lists only the issues that block a Jira release from shipping (open high-priority
        work, issues blocked by unfinished links, reopened work), most severe first.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: The Jira project key. Defaults to the current project.
        versionName:
          title: Version name
          type: string
          required: false
          description: The fix version name. Defaults to the next unreleased version.
    - key: get-issue-ship-risk
      name: Get issue ship risk
      function: action-issue-risk
      actionVerb: GET
      description: >
        Explains how risky a single Jira issue is for its release: priority, blockers,
        staleness, reopen churn, missing acceptance criteria and ownership.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key, for example SHOP-42. Defaults to the current issue.
    - key: post-go-no-go-report
      name: Post go/no-go report
      function: action-post-report
      actionVerb: CREATE
      description: >
        Posts the release readiness report as a comment on a Jira issue (for example the
        release ticket) so the team has a written go/no-go record. Only use when the user
        explicitly asks to post or share the report.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The issue to comment on. Defaults to the current issue.
        projectKey:
          title: Project key
          type: string
          required: false
          description: The project of the release. Defaults to the issue's project.
        versionName:
          title: Version name
          type: string
          required: false
          description: The fix version to report on. Defaults to the next unreleased version.

  function:
    - key: ui-resolver
      handler: index.uiHandler
    - key: action-readiness
      handler: index.getReleaseReadiness
    - key: action-blockers
      handler: index.listReleaseBlockers
    - key: action-issue-risk
      handler: index.getIssueShipRisk
    - key: action-post-report
      handler: index.postGoNoGoReport

resources:
  - key: release-board
    path: src/frontend/index.jsx
  - key: issue-panel
    path: src/frontend/panel.jsx
  - key: agent-prompts
    path: prompts

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
